<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Enter vehicle information for a buyer-confidence review" />
  <meta property="og:title" content="Enter Vehicle Details | 2Nspira" />
  <meta property="og:description" content="Enter VIN, listing URL, asking price, and mileage for a buyer-confidence review" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <title>Enter Vehicle Details | 2Nspira</title>
  <style>
    :root {
      --bg: #0b1020;
      --panel: #131a2e;
      --card: #151f3f;
      --text: #e8ecf8;
      --muted: #a6b0cc;
      --accent: #58a6ff;
      --accent2: #7ee787;
      --border: rgba(255,255,255,.04);
      --max: 720px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: linear-gradient(180deg, #0b1020 0%, #131a2e 100%);
      color: var(--text);
      line-height: 1.55;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .wrap { max-width: var(--max); margin: 0 auto; padding: 0 20px; }
    .nav { padding: 18px 0; position: sticky; top: 0; z-index: 20; backdrop-filter: blur(8px); background: rgba(7,17,31,.72); border-bottom: 1px solid rgba(255,255,255,.06); }
    .nav-inner { display:flex; justify-content:space-between; align-items:center; gap:16px; }
    .brand-link { display:inline-flex; align-items:center; gap:14px; color: var(--text); text-decoration:none; }
    .brand-link:hover .brand-kicker, .brand-link:focus-visible .brand-kicker { color: var(--accent2); }
    .brand-link:focus-visible { border-radius: 18px; }
    .brand-logo { height: 52px; width: auto; border-radius: 12px; background: rgba(255,255,255,.96); padding: 5px 10px; box-shadow: 0 10px 28px rgba(0,0,0,.22); }
    .brand-meta { display:grid; gap:4px; }
    .brand-name { font-weight: 800; font-size: 21px; letter-spacing:.02em; line-height:1; }
    .brand-kicker { color: var(--muted); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .12em; transition: color 0.2s ease; }
    .btn { display:inline-block; padding: 14px 20px; border-radius: 12px; font-weight: 700; transition: all 0.2s ease; }
    .btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,.2); }
    .btn-primary { background: var(--accent); color: #07101f; }
    .btn-secondary { border:1px solid var(--border); background: rgba(255,255,255,.03); }
    .btn-secondary:hover { background: rgba(255,255,255,.06); }
    .section { padding: 56px 0 84px; }
    h1 { font-size: clamp(28px, 5vw, 40px); line-height:1.1; margin: 0 0 18px; }
    .sub { font-size: 18px; color: #d5def7; margin-bottom: 32px; }
    .card { background: var(--card); border:1px solid var(--border); border-radius: 20px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.25); }
    .form-group { margin-bottom: 18px; }
    label { display:block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text); }
    input, select { width: 100%; padding: 14px 16px; border-radius: 12px; border:1px solid var(--border); background: #0f1730; color: var(--text); font-size: 16px; transition: border-color 0.2s ease; }
    input:focus, select:focus { border-color: var(--accent); }
    .form-grid { display:grid; grid-template-columns: repeat(2,1fr); gap: 18px; }
    .form-grid .form-group { margin-bottom: 0; }
    .muted { color: var(--muted); }
    .back-link { display:inline-flex; align-items:center; gap: 8px; color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    .back-link:hover { color: var(--accent); }
    .back-icon { font-size: 16px; }
    .info-box { padding: 16px; border-radius: 12px; background: rgba(88,166,255,.08); border:1px solid rgba(88,166,255,.2); margin-bottom: 24px; }
    .info-box strong { display:block; margin-bottom: 6px; color: var(--accent); }
    .info-box p { margin: 0; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <a href="https://www.2nspira.com/" class="brand-link" target="_blank" rel="noreferrer" aria-label="Visit the 2Nspira website">
        <img src="/2nspira-logo.jpg" alt="2Nspira" class="brand-logo" />
        <span class="brand-meta">
          <span class="brand-name">2Nspira</span>
          <span class="brand-kicker">Visit 2Nspira.com</span>
        </span>
      </a>
      <a href="/" class="btn btn-secondary" style="padding: 10px 16px; font-size: 14px;">Back to Home</a>
    </div>
  </div>

  <div class="wrap section">
    <a href="/" class="back-link">
      <span class="back-icon">←</span>
      <span>Back to home</span>
    </a>

    <div class="card">
      <h1>Enter vehicle details</h1>
      <p class="sub">We'll use this information to generate your buyer-confidence review</p>

      <div class="info-box">
        <strong>What you'll need:</strong>
        <p>VIN (17 characters), listing URL (if available), asking price, and mileage</p>
      </div>

      <form id="vinForm">
        <div class="form-group">
          <label for="vin">Vehicle VIN <span style="color: var(--accent2);">*</span></label>
          <input type="text" id="vin" name="vin" placeholder="Enter 17-character VIN" maxlength="17" required />
        </div>

        <div class="form-group">
          <label for="listingUrl">Listing URL (optional)</label>
          <input type="url" id="listingUrl" name="listingUrl" placeholder="https://..." />
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="askingPrice">Asking price <span style="color: var(--accent2);">*</span></label>
            <input type="number" id="askingPrice" name="askingPrice" placeholder="28995" required />
          </div>
          <div class="form-group">
            <label for="mileage">Mileage <span style="color: var(--accent2);">*</span></label>
            <input type="number" id="mileage" name="mileage" placeholder="72105" required />
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label for="seller">Seller type</label>
            <select id="seller" name="seller">
              <option value="Dealer">Dealer</option>
              <option value="Private party">Private party</option>
              <option value="Auction">Auction</option>
            </select>
          </div>
          <div class="form-group">
            <label for="condition">Condition</label>
            <select id="condition" name="condition">
              <option value="Excellent">Excellent</option>
              <option value="Good">Good</option>
              <option value="Fair">Fair</option>
            </select>
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 24px; font-size: 18px;">Start Review</button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('vinForm');
      
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        
        const vin = document.getElementById('vin').value.trim().toUpperCase();
        const listingUrl = document.getElementById('listingUrl').value.trim();
        const askingPrice = document.getElementById('askingPrice').value.trim();
        const mileage = document.getElementById('mileage').value.trim();
        const seller = document.getElementById('seller').value;
        const condition = document.getElementById('condition').value;
        
        // Build URL with query params
        let url = '/live.html?';
        url += `vin=${encodeURIComponent(vin)}`;
        if (listingUrl) url += `&listingUrl=${encodeURIComponent(listingUrl)}`;
        url += `&askingPrice=${encodeURIComponent(askingPrice)}`;
        url += `&mileage=${encodeURIComponent(mileage)}`;
        url += `&seller=${encodeURIComponent(seller)}`;
        url += `&condition=${encodeURIComponent(condition)}`;
        
        window.location.href = url;
      });
    });
  </script>
</body>
</html>
